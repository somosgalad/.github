<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 56" role="img" aria-label="Galad" shape-rendering="crispEdges">
<title>Galad</title>
<style>
.faisca,.acesa{opacity:0;animation:9s steps(1,end) infinite}
.faisca{animation-name:faisca}
.acesa{animation-name:acende}
@keyframes faisca{0%{opacity:1}3%,100%{opacity:0}}
@keyframes acende{0%{opacity:0}3%,80%{opacity:1}81%,100%{opacity:0}}
.l0{animation-delay:0.50s}.l1{animation-delay:0.54s}.l2{animation-delay:0.58s}.l3{animation-delay:0.61s}.l4{animation-delay:0.65s}
.feixe{opacity:0;animation:varre 9s infinite}
@keyframes varre{
0%,5.56%{opacity:0;transform:translateX(64px)}
5.57%{opacity:1;transform:translateX(64px);animation-timing-function:steps(11,end)}
7.88%{opacity:1;transform:translateX(152px)}
7.89%,100%{opacity:0;transform:translateX(152px)}}
.brilho{animation:pisca 9s steps(1,end) infinite}
@keyframes pisca{0%,6%{opacity:.6}5.57%,14%{opacity:1}13.89%,100%{opacity:.8}}
/* Quem pediu menos movimento vê o título aceso e parado, sem feixe */
@media (prefers-reduced-motion:reduce){*{animation:none!important}.feixe,.faisca{display:none}.acesa{opacity:1}}
</style>
