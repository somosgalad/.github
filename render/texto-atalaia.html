<!doctype html><html><head><meta charset="utf-8"><style>
/* Camada de texto do cartão do Atalaia (fundo transparente, vai por cima do render 3D).
   Só a manchete, como página de produto: o mostrador e a sombra contam o resto.
   "Atalaia" no azul-claro da marca (#8C9CF2), o mesmo da logo em fundo escuro. */
@font-face{font-family:Inter;src:url(../../marca-galad/fontes/Inter.ttf);font-weight:100 900}
html,body{margin:0;background:transparent}
.tela{width:1280px;height:640px;display:flex;justify-content:center;padding-top:66px;box-sizing:border-box}
h1{font:600 46px/1.1 Inter;letter-spacing:-.028em;color:#E8ECF2;margin:0;text-align:center}
b{font-weight:600;color:#8C9CF2}
</style></head><body><div class="tela">
<h1>Multa é coisa de quem não tem <b>Atalaia.</b></h1>
</div></body></html>
